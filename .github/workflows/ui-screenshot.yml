name: UI screenshot

on:
  push:
    branches: [claude/inspector-frontend-redesign-uo60sw]
  workflow_dispatch:

jobs:
  screenshot:
    strategy:
      fail-fast: false
      matrix:
        variant: [sb-no-legend, sb-no-selection, sb-no-badge, sb-single-selection, sb-no-help]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Apply variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          python3 - <<'PY'
          import os
          p = "Inspector/ContentView.swift"
          s = open(p).read()
          v = os.environ["VARIANT"]
          subs = {
              "no-title-modifier": [(".modifier(HiddenWindowTitle())", "")],
              "no-searchable": ['.searchable(text: $vm.searchText, placement: .toolbar, prompt: "Filter by name")', ""],
              "plain-detail": [("            detail\n                .navigationSplitViewColumnWidth", "            Text(\"DETAIL TOP\").frame(maxWidth: .infinity, maxHeight: .infinity, alignment: .top)\n                .navigationSplitViewColumnWidth")],
              "plain-sidebar": [("            Sidebar(vm: vm)\n", "            List { Text(\"SIDEBAR TOP\"); Text(\"row 2\") }\n")],
              "no-task": [("            await vm.refresh()\n            hasScanned = true", "            hasScanned = true")],
              "sb-no-legend": [("            facetList\n                .layoutPriority(-1)\n            Divider()\n            TierLegend()", "            facetList")],
              "sb-no-selection": [("List(selection: selection) {", "List {")],
              "sb-no-badge": [("        .badge(items.count)\n", "")],
              "sb-single-selection": [("List(selection: selection) {", "List(selection: .constant(Optional(Facet.safety(nil)))) {")],
              "sb-no-help": [("                        .help(level.shortExplanation)\n", "")],
          }.get(v, [])
          if subs and isinstance(subs[0], str):
              subs = [tuple(subs)]
          for a, b in subs:
              assert a in s, (v, a)
              s = s.replace(a, b)
          open(p, "w").write(s)
          PY
      - name: Build
        run: |
          xcodebuild -scheme Inspector -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build | grep -E "error:|BUILD" || true
      - name: Launch and capture
        run: |
          open build/Build/Products/Debug/Inspector.app
          sleep 25
          screencapture -x shot.png
          osascript -e 'tell application "System Events" to tell process "Inspector" to get {position, size} of window 1' || true
          sips -Z 900 -s format jpeg -s formatOptions 45 shot.png --out shot.jpg >/dev/null
          echo "BEGIN_SHOT ${{ matrix.variant }}"
          base64 -i shot.jpg | tr -d '\n' | fold -w 8000
          echo
          echo "END_SHOT"
