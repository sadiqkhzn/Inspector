name: UI screenshot

on:
  push:
    branches: [fix/details-pane-initial-state]

jobs:
  screenshot:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -scheme Inspector -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || status=$?
          grep -E "error:|BUILD" build.log || true
          exit ${status:-0}
      - name: Launch and capture
        run: |
          shot() {
            screencapture -x "$1.png"
            sips -Z 1100 -s format jpeg -s formatOptions 50 "$1.png" --out "$1.jpg" >/dev/null
            echo "BEGIN_SHOT $1"
            base64 -i "$1.jpg" | tr -d '\n' | fold -w 8000
            echo
            echo "END_SHOT"
          }
          open build/Build/Products/Debug/Inspector.app
          sleep 1
          shot scanning
          sleep 25
          osascript -e 'tell application "Inspector" to activate' || true
          sleep 2
          shot scanned
          osascript -e 'tell application "System Events" to keystroke "i" using {command down, option down}' || true
          sleep 2
          shot opened
