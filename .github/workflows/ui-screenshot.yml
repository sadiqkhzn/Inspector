name: UI screenshot

on:
  push:
    branches: [feat/icon-full-bleed]

jobs:
  screenshot:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -scheme Inspector -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || status=$?
          grep -E "error:|BUILD" build.log || true
          exit ${status:-0}
      - name: Launch and capture the Dock
        run: |
          open build/Build/Products/Debug/Inspector.app
          sleep 20
          screencapture -x full.png
          h=$(sips -g pixelHeight full.png | awk '/pixelHeight/{print $2}')
          w=$(sips -g pixelWidth full.png | awk '/pixelWidth/{print $2}')
          strip=$(( h / 7 ))
          sips -c $strip $w --cropOffset $(( h - strip )) 0 full.png --out dock.png >/dev/null
          sips -Z 1400 -s format jpeg -s formatOptions 70 dock.png --out dock.jpg >/dev/null
          echo "BEGIN_SHOT dock"
          base64 -i dock.jpg | tr -d '\n' | fold -w 8000
          echo
          echo "END_SHOT"
